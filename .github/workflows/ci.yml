name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter brasa.ui build

      - name: Build CLI
        run: pnpm --filter @odougaraujo/brasa-ui build

      - name: Build registry
        run: node scripts/build-registry.mjs

      - name: Build site
        run: pnpm --filter @brasa-ui/www build
